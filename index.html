<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI活用ナレッジ</title>
<meta name="description" content="AIを業務で使うための知識をまとめたページ集です。">
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --text:#1f2328; --muted:#5b6370; --line:#e3e0d8;
  --accent:#1f6f5c; --accent-soft:#e3f1ec;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#1f2226; --text:#e8e6e1; --muted:#a3a9b2; --line:#33373d;
    --accent:#6cc4a8; --accent-soft:#1d3530;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#1f2226; --text:#e8e6e1; --muted:#a3a9b2; --line:#33373d;
  --accent:#6cc4a8; --accent-soft:#1d3530;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-height:1.8;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:48px 16px 80px}
.kicker{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.08em}
h1{font-size:clamp(28px,5vw,40px);line-height:1.3;margin:6px 0 12px}
.lead{color:var(--muted);margin:0 0 24px}
.search{width:100%;padding:12px 14px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:4px;margin:28px 0 0;border-bottom:2px solid var(--text);overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border:1px solid transparent;border-bottom:none;
  border-radius:8px 8px 0 0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--accent-soft)}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg)}
.tab .count{font-size:12px;font-weight:400;margin-left:6px;opacity:.75}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{padding-top:20px}
.cat-desc{color:var(--muted);margin:0 0 14px;font-size:14px}
a.card .cat{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:8px}
.list{display:grid;gap:10px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent);background:var(--accent-soft)}
a.card b{display:block;font-size:17px}
a.card span{display:block;color:var(--muted);font-size:14px}
a.card small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px;padding:4px 2px}
footer{margin-top:64px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">AX教育ユニット-AX ENABLEMENT TEAM-</div>
  <h1>AI活用ナレッジ</h1>
  <p class="lead">AIを業務で安全に、効果的に使うための知識をまとめたページ集です。</p>
  <input class="search" id="q" type="search" placeholder="キーワードで絞り込む（例：著作権）" aria-label="キーワードで絞り込む">
  <div class="tabs" id="tabs" role="tablist" aria-label="分類"></div>
  <div class="panel" id="panel" role="tabpanel"></div>
  <footer>AX教育ユニット-AX Enablement Team- ／ 記事の追加方法はリポジトリの README を参照</footer>
</div>

<script>
/* ===== 記事一覧：記事を追加したら、ここに1件書き足す ===== */
var ARTICLES = [
  { cat: "lectures", file: "lectures/20261124_生成AIを正しく使うために.html",
    title: "生成AIを正しく使うために　仕組み・使い方・安全",
    desc: "デジタル化の4段階、LLMとハルシネーション、AIは計算していない、よい出力の5段階、RAG、情報の棚卸しとリスク、安全に使う10の行動、AIエージェントとトレンド、AXへの4ステップ（スライド形式）",
    date: "2026-11-24" },
  { cat: "basics", file: "basics/20261120_データベースの基礎知識.html",
    title: "データベースの基礎知識　表・種類・CRUD",
    desc: "DBとは、テーブル・ロー・カラム、マスタとトランザクション、CRUD、RDBとNoSQL、トランザクション処理、AI活用との関係（スライド形式）",
    date: "2026-11-20" },
  { cat: "teaching", file: "teaching/20261120_AI活用で成果を上げる人と感じない人の違い.html",
    title: "AI活用で成果を上げる人と、効果を感じない人の違い",
    desc: "差を生むのは知識や操作スキルより「AIで仕事を変えようとしているか」。8観点の比較、5つの理由、受講後の差、状態別の対策、4つの力",
    date: "2026-11-20" },
  { cat: "basics", file: "basics/20261116_AI時代に必要な思考力10要素.html",
    title: "AI時代に必要な思考力 10要素",
    desc: "クリティカル・ロジカル・システム思考など10の思考力、6STEPの思考プロセス、4領域の能力体系、セレンディピティ",
    date: "2026-11-16" },
  { cat: "basics", file: "basics/20261115_AIを安全に使うコツ.html",
    title: "AIを安全に使うコツ",
    desc: "入力してよい情報、ハルシネーション、著作権、プロンプトインジェクション、使う前のチェックリスト",
    date: "2026-11-15" }
];

var CATS = [
  { id: "lectures",  name: "講義資料",       desc: "講座で使うスライド・講義資料" },
  { id: "basics",    name: "基礎",           desc: "AIの仕組み・用語・安全な使い方" },
  { id: "prompting", name: "問いかけ方",     desc: "AIへの指示の出し方" },
  { id: "tools",     name: "ツール",         desc: "ツール・サービスの使い方" },
  { id: "business",  name: "業務活用",       desc: "業務での活用・事例・提案" },
  { id: "teaching",  name: "教え方",         desc: "講座運営・伝わる説明" },
  { id: "others",    name: "その他",         desc: "どれにも当てはまらないもの" }
];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

var TABS = [{ id: "all", name: "すべて", desc: "全分類の記事" }].concat(CATS);
var catName = {}; CATS.forEach(function(c){ catName[c.id] = c.name; });
var current = "all", query = "";

function matches(a){ return !query || (a.title + a.desc).toLowerCase().indexOf(query) !== -1; }

function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(function(t){
    var n = ARTICLES.filter(function(a){ return (t.id === "all" || a.cat === t.id) && matches(a); }).length;
    var sel = t.id === current;
    return '<button class="tab" role="tab" data-id="' + t.id + '" aria-selected="' + sel + '" tabindex="' + (sel ? 0 : -1) + '">'
      + esc(t.name) + '<span class="count">' + n + '</span></button>';
  }).join("");
}

function renderPanel(){
  var t = TABS.filter(function(x){ return x.id === current; })[0];
  var items = ARTICLES.filter(function(a){ return (current === "all" || a.cat === current) && matches(a); })
    .sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var html = '<p class="cat-desc">' + esc(t.desc) + '</p><div class="list">';
  html += items.length ? items.map(function(a){
    return '<a class="card" href="' + encodeURI(a.file) + '"><b>' + esc(a.title) + '</b><span>' + esc(a.desc) + '</span>'
      + '<small>' + (current === "all" ? '<span class="cat">' + esc(catName[a.cat] || a.cat) + '</span>' : '') + esc(a.date) + '</small></a>';
  }).join("") : '<div class="empty">' + (query ? '該当する記事はありません' : 'まだ記事はありません') + '</div>';
  document.getElementById("panel").innerHTML = html + '</div>';
}

function select(id, focus){
  if (!TABS.some(function(t){ return t.id === id; })) id = "all";
  current = id;
  try { history.replaceState(null, "", id === "all" ? location.pathname : "#" + id); } catch (e) {}
  renderTabs(); renderPanel();
  var sel = document.querySelector('.tab[data-id="' + id + '"]');
  var tabs = document.getElementById("tabs");
  if (sel) tabs.scrollLeft = sel.offsetLeft - (tabs.clientWidth - sel.offsetWidth) / 2;
  if (focus) document.querySelector('.tab[data-id="' + id + '"]').focus();
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest(".tab"); if (b) select(b.dataset.id);
});
document.getElementById("tabs").addEventListener("keydown", function(e){
  var i = TABS.findIndex(function(t){ return t.id === current; });
  if (e.key === "ArrowRight") { e.preventDefault(); select(TABS[(i + 1) % TABS.length].id, true); }
  if (e.key === "ArrowLeft")  { e.preventDefault(); select(TABS[(i - 1 + TABS.length) % TABS.length].id, true); }
});
document.getElementById("q").addEventListener("input", function(e){
  query = e.target.value.trim().toLowerCase(); renderTabs(); renderPanel();
});
select(location.hash.slice(1) || "all");
</script>
</body>
</html>
